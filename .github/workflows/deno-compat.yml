name: "Layer 5: Deno compatibility"

on:
  pull_request:
    paths:
      - "crates/lykn-lang/src/expander/**"
      - "crates/lykn-cli/src/**"
  schedule:
    - cron: "0 6 * * 3"  # weekly, Wednesday 6am UTC

env:
  CARGO_TERM_COLOR: always

jobs:
  compat:
    name: "Deno ${{ matrix.deno-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Deno 2.3.1 is the supported floor: the repo's deno.lock is lockfile v5,
      # which Deno 2.0-2.2 cannot read, and Deno 2.3 introduced lockfile v5.
      # The import-macro subprocess also depends on Deno 2-era `deno eval`
      # behavior such as `--ext=js`.
      matrix:
        deno-version: ["2.3.1", "2.x", "canary"]
    continue-on-error: ${{ matrix.deno-version == 'canary' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ matrix.deno-version }}
      - uses: Swatinem/rust-cache@v2

      - name: Show Deno version
        run: deno --version

      - name: Run resolver and Deno-dependent tests
        run: cargo test --workspace --all-features -- --include-ignored resolver deno
