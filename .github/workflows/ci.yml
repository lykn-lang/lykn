name: CI

on:
  push:
    branches: [main, "release/*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: Swatinem/rust-cache@v2
      - run: make build
      - run: make lint

  tests:
    name: "Rust + JS + lykn tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: Swatinem/rust-cache@v2
      - run: make build
      - run: make test

  doc-tests:
    name: "Documentation tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: Swatinem/rust-cache@v2
      - run: make build
      - run: make test-docs

  rust-integration:
    name: "Layer 2: Rust integration tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: Swatinem/rust-cache@v2
      # Populate target/lykn/build/ before cargo test: some workspace integration
      # tests shell out to `lykn test`, which resolves the built packages there.
      # Doing it once up front (not per-test) avoids a concurrent-build race.
      - run: make fresh-artifacts
      - run: cargo test --workspace --all-features -- --include-ignored

  bundle-size:
    name: "Bundle size check (DD-37)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The fixed DD-37 baseline commit must be available for calibration.
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          # Compare both revisions with the same tools; see docs/bundle-size.md.
          deno-version: v2.7.7
      - run: make bundle-size-check

  publishing:
    name: "Publishing pipeline tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: Swatinem/rust-cache@v2
      - run: make test-publishing
